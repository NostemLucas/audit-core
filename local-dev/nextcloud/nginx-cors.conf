# Nextcloud never adds CORS headers on its own for WebDAV — by design, since a browser uploading straight to a
# public share (as audit-core's frontend does, PUT /public.php/webdav/<file>) is exactly the kind of cross-origin
# request Nextcloud is conservative about. This proxy is the piece that makes that browser upload actually work in
# dev: it terminates CORS itself, in front of a real Nextcloud, instead of Nextcloud doing it.
#
# TLS terminates here too (mkcert leaf cert for 192.168.0.11.sslip.io — a real DNS name that resolves to the same
# LAN IP from the host AND from inside any container, sidestepping "localhost means something different on each
# side" entirely): Nextcloud's own `user_oidc` app refuses to finish a login unless it sees itself served over
# HTTPS, needed to test the Authentik SSO login into Nextcloud itself (docs/07 doesn't cover this — it's not part of
# audit-core's own integration, which only ever talks to Nextcloud over WebDAV/OCS with a service account).
server {
    listen 80;
    server_name 192.168.0.11.sslip.io;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name 192.168.0.11.sslip.io;
    client_max_body_size 2048M;
    proxy_read_timeout 300s;

    ssl_certificate /etc/nginx/certs/nextcloud.pem;
    ssl_certificate_key /etc/nginx/certs/nextcloud-key.pem;

    location / {
        add_header 'Access-Control-Allow-Origin' 'http://localhost:3000' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PROPFIND, MKCOL, REPORT, PROPPATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Depth, OCS-APIREQUEST, If-Match, If-None-Match' always;
        add_header 'Access-Control-Expose-Headers' 'OC-FileId, OC-ETag' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
