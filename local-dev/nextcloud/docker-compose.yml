services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${PG_PASS}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]

  app:
    image: nextcloud:30-apache
    restart: unless-stopped
    depends_on: [db]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${PG_PASS}
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost app 192.168.0.11.sslip.io
      TRUSTED_PROXIES: 0.0.0.0/0
      OVERWRITEHOST: 192.168.0.11.sslip.io:8443
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://192.168.0.11.sslip.io:8443
    volumes:
      - nc-data:/var/www/html
    networks: [internal]

  worker:
    # Procesa los QueuedJob de Nextcloud (incluido el envío de cada webhook, `WebhookCall`) en un loop propio en vez
    # de esperar al cron.php de la imagen (que solo corre cada 5 minutos) — es el modo que la propia documentación de
    # Nextcloud recomienda para esto: la subida de evidencia se refleja en audit-core en segundos, no en una ventana
    # de hasta 5 minutos.
    image: nextcloud:30-apache
    restart: unless-stopped
    depends_on: [db, app]
    entrypoint: ['/entrypoint.sh']
    command: ['php', 'occ', 'background-job:worker', '--interval=5']
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${PG_PASS}
    volumes:
      - nc-data:/var/www/html
    networks: [internal]

  onlyoffice:
    # Document Server: edita/convierte los .docx que sube `generate-report.use-case.ts`. JWT obligatorio (si no,
    # cualquiera en la red podría pedirle que abra/convierta lo que quiera) — el mismo secreto va acá Y en los dos
    # config keys de Nextcloud de más abajo (README §4); si alguno de los tres no coincide, el editor carga pero
    # falla al abrir el documento ("Error de descarga" o "token inválido" en vez de cargar el contenido).
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: Authorization
    networks: [internal]

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [app, onlyoffice]
    ports:
      - '8098:80'
      - '8443:443'
      - '8444:444'
    volumes:
      - ./nginx-cors.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/nextcloud.pem:/etc/nginx/certs/nextcloud.pem:ro
      - ./certs/nextcloud-key.pem:/etc/nginx/certs/nextcloud-key.pem:ro
    networks: [internal]

networks:
  internal:

volumes:
  db-data:
  nc-data:
