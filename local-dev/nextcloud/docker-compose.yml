services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${PG_PASS}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]

  app:
    image: nextcloud:30-apache
    restart: unless-stopped
    depends_on: [db]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${PG_PASS}
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost app 192.168.0.11.sslip.io
      TRUSTED_PROXIES: 0.0.0.0/0
      OVERWRITEHOST: 192.168.0.11.sslip.io:8443
      OVERWRITEPROTOCOL: https
      OVERWRITECLIURL: https://192.168.0.11.sslip.io:8443
    volumes:
      - nc-data:/var/www/html
    networks: [internal]

  worker:
    # Procesa los QueuedJob de Nextcloud (incluido el envío de cada webhook, `WebhookCall`) en un loop propio en vez
    # de esperar al cron.php de la imagen (que solo corre cada 5 minutos) — es el modo que la propia documentación de
    # Nextcloud recomienda para esto: la subida de evidencia se refleja en audit-core en segundos, no en una ventana
    # de hasta 5 minutos.
    image: nextcloud:30-apache
    restart: unless-stopped
    depends_on: [db, app]
    entrypoint: ['/entrypoint.sh']
    command: ['php', 'occ', 'background-job:worker', '--interval=5']
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${PG_PASS}
    volumes:
      - nc-data:/var/www/html
    networks: [internal]

  onlyoffice-db:
    # Postgres PROPIO del Document Server (doc_changes/task_result) — nada que ver con el `db` de Nextcloud de arriba.
    # Sin esto (y sin onlyoffice-redis/onlyoffice-rabbitmq) el contenedor onlyoffice cae solo a "memory runtime" (log:
    # "no workers will be forked"): ConvertService (conversión de un solo tiro) sigue andando, pero abrir una sesión
    # real de edición falla — comprobado en vivo: con /ConvertService.ashx directo la conversión da 100%
    # Percent/EndConvert=true, pero el editor completo en el navegador tira "Error de descarga", sin NINGÚN error
    # nuevo en los logs de Nextcloud ni del Document Server (la falla real pasa en la parte que ninguno de los dos
    # loguea por defecto — confirmado además con `nc -zv 127.0.0.1 5432/6379/5672` DENTRO del contenedor onlyoffice:
    # connection refused en los tres, nada bundleado).
    image: postgres:9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: onlyoffice
      POSTGRES_USER: onlyoffice
      POSTGRES_PASSWORD: ${ONLYOFFICE_DB_PASS}
    volumes:
      - onlyoffice-db-data:/var/lib/postgresql/data
    networks: [internal]

  onlyoffice-rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    networks: [internal]

  onlyoffice-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]

  onlyoffice:
    # Document Server: edita/convierte los .docx que sube `generate-report.use-case.ts`. JWT obligatorio (si no,
    # cualquiera en la red podría pedirle que abra/convierta lo que quiera) — el mismo secreto va acá Y en los dos
    # config keys de Nextcloud de más abajo (README §7); si alguno de los tres no coincide, el editor carga pero
    # falla al abrir el documento ("Error de descarga" o "token inválido" en vez de cargar el contenido).
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    depends_on: [onlyoffice-db, onlyoffice-rabbitmq, onlyoffice-redis]
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: Authorization
      DB_TYPE: postgres
      DB_HOST: onlyoffice-db
      DB_PORT: 5432
      DB_NAME: onlyoffice
      DB_USER: onlyoffice
      DB_PWD: ${ONLYOFFICE_DB_PASS}
      AMQP_TYPE: rabbitmq
      AMQP_URI: amqp://guest:guest@onlyoffice-rabbitmq
      REDIS_SERVER_HOST: onlyoffice-redis
      REDIS_SERVER_PORT: 6379
      # Sin esto, el propio proceso Node del Document Server no confía en el certificado mkcert y cualquier llamada
      # HTTPS que haga hacia el proxy (p.ej. su propia DocumentServerUrl pública) falla con
      # UNABLE_TO_VERIFY_LEAF_SIGNATURE — mismo patrón que NODE_EXTRA_CA_CERTS en audit-core/.env, acá del lado del
      # Document Server en vez del backend.
      NODE_EXTRA_CA_CERTS: /certs/mkcert-ca/rootCA.pem
    volumes:
      - ./certs/mkcert-ca:/certs/mkcert-ca:ro
    networks: [internal]

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [app, onlyoffice]
    ports:
      - '8098:80'
      - '8443:443'
      - '8444:444'
    volumes:
      - ./nginx-cors.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/nextcloud.pem:/etc/nginx/certs/nextcloud.pem:ro
      - ./certs/nextcloud-key.pem:/etc/nginx/certs/nextcloud-key.pem:ro
    networks: [internal]

networks:
  internal:

volumes:
  db-data:
  nc-data:
  onlyoffice-db-data:
